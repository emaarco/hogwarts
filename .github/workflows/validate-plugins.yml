name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure jq is available
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq --version

      - name: Validate marketplace JSON
        run: jq empty .claude-plugin/marketplace.json

      - name: Check marketplace plugin sources resolve
        run: |
          for src in $(jq -r '.plugins[].source' .claude-plugin/marketplace.json); do
            test -d "$src" || (echo "marketplace.json source not found: $src" && exit 1)
            test -f "$src/.claude-plugin/plugin.json" || (echo "$src missing plugin.json" && exit 1)
            echo "$src: source OK"
          done

  validate-revelio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/revelio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"

      - name: Validate SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -10 "$f" | grep -q "^name:" || { echo "$f: missing name"; exit 1; }
            head -10 "$f" | grep -q "^description:" || { echo "$f: missing description"; exit 1; }
            echo "$f: frontmatter OK"
          done

      - name: Run tests
        run: node --test scripts/*.test.mjs

  validate-felix-felicis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/felix-felicis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON files
        run: |
          python3 -c "import json,sys; json.load(open('.claude-plugin/plugin.json'))" && echo "plugin.json: OK"

      - name: Validate SKILL.md frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -10 "$f" | grep -q "^name:" || { echo "$f: missing name"; exit 1; }
            head -10 "$f" | grep -q "^description:" || { echo "$f: missing description"; exit 1; }
            echo "$f: frontmatter OK"
          done

  validate-imperio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/imperio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

  validate-protego-totalum:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/protego-totalum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Ensure jq is available
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Run tests
        run: npm test
